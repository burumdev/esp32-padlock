<!doctype html>
<html>
  <head>
    <title>ESP32 On Your Desk</title>
    <style>
      * {
        margin: 0;
        font-family: sans-serif;
        box-sizing: border-box;
      }
      body {
        background-color: #222;
      }
      h1 {
        text-align: center;
        margin-bottom: 25px;
      }
      p {
        line-height: 1.4rem;
      }
      form {
        padding-top: 20px;
      }
      .no-error {
        color: red;
      }
      .page-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px;
      }
      .page-inner {
        background-color: #fff;
        box-shadow: 0 0 10px 5px rgba(0, 255, 0, 0.75);
        width: 455px;
        border: 1px solid green;
        padding: 25px;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        svg {
          width: 100px;
          margin-bottom: 25px;
        }
      }
      .inputs {
        width: 100%;
        display: flex;
        justify-content: space-between;
        input {
          flex-grow: 1;
          margin-right: 10px;
          padding-left: 8px;
        }
        input, button {
          font-size: 16px;
          height: 32px;
          font-weight: bold;
          border-radius: 8px;
        }
        button {
          background: orange;
          cursor: pointer;
        }
      }
      .no-error {
        display: none;
      }
      .error {
        display: block;
        color: red;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="page-container">
      <div class="page-inner">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 47.5 47.5"><defs><clipPath id="a"><path d="M0 38h38V0H0v38z"/></clipPath></defs><g clip-path="url(#a)" transform="matrix(1.25 0 0 -1.25 0 47.5)"><path d="M19 37c-4.612 0-8.483-3.127-9.639-7.372l3.855-1.052A5.998 5.998 0 0025 27V17h4v10c0 5.523-4.477 10-10 10" fill="#bcbec0"/><path d="M31 5a4 4 0 00-4-4H11a4 4 0 00-4 4v10a4 4 0 004 4h16a4 4 0 004-4V5z" fill="#ffac33"/></g></svg>
        <h1>ESP32 <br/> On Your Desk</h1>
        <p>Welcome to the ESP32 sitting on your desk. The device is unlocked. <br><br> You can lock it again for fun by entering the password. <br><br> Good lock! <br><br> ESP32OnYourDesk team.</p>
        <form action="/" method="post">
          <p class="no-error">The pass you provided was wrong in many ways.</p>
          <div class="inputs">
            <input name="p" type="password" placeholder="Da passvoid?" />
            <button>Lock Device</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
